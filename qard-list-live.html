<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1424">
<title>بەڕێوەبردنی قەرزەکان</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:rgba(19,29,48,.88);--line:rgba(148,163,184,.16);--muted:#9aa9bd;--accent:#a3e635;--accent2:#34d399;--danger:#fb7185;--text:#f4f7fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:28px 15px 46px;color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 8% 0%,rgba(52,211,153,.13),transparent 34%),radial-gradient(ellipse at 100% 18%,rgba(59,130,246,.13),transparent 30%),linear-gradient(145deg,#0c1424 0%,#080d18 58%,#0b1220 100%);background-attachment:fixed}
.wrap{width:min(100%,700px);margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:3px 2px 22px}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.2px}
.eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(163,230,53,.8)}
.head h1{font-size:clamp(22px,5vw,29px);font-weight:850;letter-spacing:-.6px;margin:7px 0 0}
.pill{border:1px solid rgba(163,230,53,.24);background:rgba(163,230,53,.08);border-radius:99px;padding:9px 13px;color:#d9f99d;font-size:11px;font-weight:700;white-space:nowrap}
.summary{position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(27,48,61,.98),rgba(19,39,49,.95) 55%,rgba(21,45,43,.96));border:1px solid rgba(110,231,183,.22);border-radius:24px;padding:22px 21px;margin-bottom:17px;box-shadow:0 18px 48px rgba(0,0,0,.2)}
.summary:after{content:'د.ع';position:absolute;left:20px;bottom:3px;font-size:64px;font-weight:900;color:rgba(255,255,255,.035);pointer-events:none}
.summary small{color:#c1d3d5;font-size:12px;font-weight:650}
.total{position:relative;z-index:1;font-size:clamp(30px,7vw,38px);font-weight:900;letter-spacing:-1px;margin:8px 0 2px;color:#bef264;overflow-wrap:anywhere;text-shadow:0 0 25px rgba(163,230,53,.12)}
.unit{font-size:12px;color:#b7c8c8}
.panel{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:21px;padding:18px;margin-bottom:16px;box-shadow:0 12px 35px rgba(0,0,0,.14)}
.panel h2{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;margin:0 0 16px}
.panel h2:before{content:'';width:4px;height:18px;border-radius:5px;background:linear-gradient(var(--accent),var(--accent2))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12px;color:#aab8ca;margin:0 2px 7px;font-weight:650}
input{width:100%;min-width:0;background:rgba(7,13,25,.78);border:1px solid #2c3a50;border-radius:13px;color:#f8fafc;padding:14px 13px;font:inherit;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:#64748b}input:focus{border-color:rgba(163,230,53,.75);background:#0b1624;box-shadow:0 0 0 3px rgba(163,230,53,.1)}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer;transition:transform .18s,filter .18s,background .18s}
button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary{width:100%;margin-top:14px;color:#14210b;background:linear-gradient(110deg,#bef264,#6ee7b7);box-shadow:0 8px 22px rgba(163,230,53,.15)}.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.secondary{background:#26364b;color:#e6edf7;border:1px solid rgba(148,163,184,.12)}.secondary:hover{background:#31445d}
.danger{background:rgba(244,63,94,.12);color:#fda4af;border:1px solid rgba(251,113,133,.16);padding:9px 11px}.danger:hover{background:rgba(244,63,94,.2)}
.actions{display:flex;gap:7px;align-items:center}.actions button{font-size:11px;padding:9px 10px;white-space:nowrap}
.tools{display:flex;gap:10px;align-items:center;margin:0 0 12px}.tools input{flex:1}.count{font-size:11px;color:#c5d2e2;white-space:nowrap;align-self:center;background:#25344a;border:1px solid rgba(148,163,184,.12);padding:8px 10px;border-radius:10px}
.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 12px;margin:9px 0;background:rgba(9,16,29,.52);border:1px solid rgba(148,163,184,.1);border-radius:15px;transition:border-color .2s,background .2s,transform .2s}.person:hover{border-color:rgba(163,230,53,.24);background:rgba(13,25,39,.8);transform:translateY(-1px)}
.person>div:first-child{min-width:0;flex:1}.person-name{font-weight:800;overflow-wrap:anywhere}.name-toggle{background:transparent;color:#f4f7fb;padding:0;text-align:right;font-weight:800;border-radius:0;font-size:14px}.name-toggle:hover{color:#d9f99d}
.debt-details{margin-top:12px;padding:10px 12px;background:rgba(5,11,21,.7);border:1px solid var(--line);border-radius:12px}.debt-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(148,163,184,.12);font-size:11px;color:#c5d1e2}.debt-line:last-child{border-bottom:0}.debt-line strong{color:#bef264;white-space:nowrap;font-size:12px}.detail-hint{font-size:11px;color:#aab8ca;margin-top:8px}
.amount{font-weight:850;color:#bef264;margin-top:6px;font-size:14px}.datetime{font-size:10px;color:#8393a9;margin-top:5px;line-height:1.7}.empty{text-align:center;color:#94a3b8;padding:32px 10px;font-size:13px}
.foot{font-size:11px;color:#8493a8;text-align:center;line-height:1.9;margin:19px 8px}.hidden{display:none!important}#authBtn{width:100%;margin-top:9px;max-width:280px}
.viewonly #formPanel,.viewonly .actions,.viewonly .debt-line>span:last-child{display:none!important}
@media(max-width:520px){body{padding:19px 11px 32px}.head{margin-bottom:17px}.head h1{font-size:23px}.pill{font-size:10px;padding:8px 10px}.summary{padding:19px 17px;border-radius:20px}.panel{padding:15px;border-radius:18px}.fields{grid-template-columns:1fr;gap:11px}.person{align-items:flex-start;padding:13px 10px}.actions{flex-shrink:0;flex-direction:column}.actions button{width:100%;min-width:75px}.total{font-size:30px}.debt-line{align-items:flex-start;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><main class="wrap">
<header class="head"><div><div class="eyebrow">تۆماری دارایی</div><h1>قائیمەی قەرزەکان</h1></div><div class="pill">بۆ مۆبایل گونجاوە</div></header>
<section class="summary"><small>کۆی گشتی قەرزەکان</small><div class="total" id="total">0</div><div class="unit">دیناری عێراقی</div></section>
<section class="panel" id="formPanel"><h2 id="formTitle">＋ زیادکردنی کەسێکی نوێ</h2><form id="debtForm"><div class="fields"><div><label for="personName">ناوی کەس</label><input id="personName" maxlength="80" placeholder="ناوی کەس بنووسە" required></div><div><label for="personAmount">ژمارەی قەرز (دینار)</label><input id="personAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="بۆ نموونە: 250000" required></div></div><button class="primary" id="saveBtn" type="submit">زیادکردن</button><button class="secondary hidden" id="cancelBtn" type="button" style="width:100%;margin-top:8px">هەڵوەشاندنەوەی دەستکاری</button></form></section>
<section class="panel"><div class="tools"><input id="search" placeholder="گەڕان بەدوای ناو..." aria-label="گەڕان"><span class="count" id="count">0 کەس</span></div><div id="list"></div></section>
<p class="foot"><span id="backupStatus">...</span><br>گۆڕانکاری لای هەموو کەسێک یەکسەر نوێ دەبێتەوە.<br><button id="authBtn" class="secondary" type="button"></button></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== ڕێکخستن: ئەم دوو بەشە بگۆڕە ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyAz9TPABXysR1ZdbG9ncc4DxjtBnQ3gbRQ",authDomain:"qard-list.firebaseapp.com",projectId:"qard-list",storageBucket:"qard-list.firebasestorage.app",messagingSenderId:"77850940561",appId:"1:77850940561:web:0e797156bdc16bf3a91b30"};
/* ====================================== */
const KEY='qard-list-v1', DB_NAME='qard-list-backup-v1', STORE='snapshots';let people=[];let editing=null;let db=null;
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-US').format(n);
function normalizeName(value){return String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function ensureDebtEntries(person){if(Array.isArray(person.debts)&&person.debts.length){person.debts=person.debts.map(d=>({id:d.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:Number(d.amount||0),createdAt:d.createdAt||person.createdAt||new Date().toISOString()}));person.amount=person.debts.reduce((sum,d)=>sum+d.amount,0)}else{person.debts=[{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:Number(person.amount||0),createdAt:person.createdAt||new Date().toISOString()}];person.amount=person.debts[0].amount}return person}
function mergeDuplicatePeople(items){const merged=[];const byName=new Map();for(const raw of items){const person=ensureDebtEntries({...raw});const key=normalizeName(person.name);if(!key)continue;const existing=byName.get(key);if(existing){existing.debts.push(...person.debts);existing.amount=existing.debts.reduce((sum,d)=>sum+d.amount,0);const dates=[existing.createdAt,person.createdAt].filter(Boolean).sort();if(dates.length)existing.createdAt=dates[0]}else{byName.set(key,person);merged.push(person)}}return merged}
function formatDateTime(value){if(!value)return 'کاتی تۆمارکردن بەردەست نییە';const d=new Date(value);if(Number.isNaN(d.getTime()))return 'کاتی تۆمارکردن بەردەست نییە';return new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)}
function openBackupDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB not supported'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function backupNow(){if(!db)return Promise.reject(new Error('Backup database unavailable'));return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({people,updatedAt:new Date().toISOString()},'latest');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function readBackup(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('latest');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
function setBackupStatus(message){$('backupStatus').textContent=message}
function loadLocal(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(parsed)?parsed:[]}catch{return []}}
let ref=null,unsub=null,editor=false;
const EDITOR_UID='IJBG9n9C5qaLzqocTG1mqPmbsS52';
const isEditor=()=>editor;
function applyMode(){document.body.classList.toggle('viewonly',!editor);$('authBtn').textContent=editor?'🔓 دەرچوون لە دەستکاریکردن':'🔒 چوونە ناو دەستکاریکردن'}
$('authBtn').onclick=async()=>{if(!window.firebase)return;if(editor){await firebase.auth().signOut();return}
const em=prompt('ئیمەیڵ:',localStorage.getItem('qard-email')||'');if(!em)return;const pw=prompt('وشەی نهێنی:');if(pw===null)return;
try{await firebase.auth().signInWithEmailAndPassword(em.trim(),pw);localStorage.setItem('qard-email',em.trim())}catch(e){alert('نەتوانرا بچیتە ژوورەوە: '+e.message)}};
const clean=o=>JSON.parse(JSON.stringify(o));
function listen(){if(unsub)return;ref=firebase.firestore().collection('debts').doc('main');
unsub=ref.onSnapshot(s=>{const v=s.exists?s.data().people:null;people=mergeDuplicatePeople(Array.isArray(v)?v:[]);if(people.length)localStorage.setItem(KEY,JSON.stringify(people));setBackupStatus('🟢 Live — پەیوەستە');render()},
e=>{setBackupStatus('❌ پەیوەندی سەرنەکەوت: '+e.message);people=mergeDuplicatePeople(loadLocal());render()})}
function initialize(){applyMode();
if(!window.firebase||FIREBASE_CONFIG.apiKey.startsWith('YOUR')){people=mergeDuplicatePeople(loadLocal());setBackupStatus('⚠️ Firebase ڕێک نەخراوە');render();return}
try{firebase.initializeApp(FIREBASE_CONFIG);
firebase.auth().onAuthStateChanged(u=>{
if(!u){editor=false;applyMode();firebase.auth().signInAnonymously().catch(e=>setBackupStatus('❌ '+e.message));return}
editor=(u.uid===EDITOR_UID);applyMode();listen();
if(editor)setTimeout(()=>{if(editor&&!people.length){const old=loadLocal();if(old.length&&confirm('داتای کۆنی ئەم ئامێرە دۆزرایەوە ('+old.length+' کەس). بنێردرێت بۆ Firebase؟')){people=mergeDuplicatePeople(old);persist()}}},1500)})}
catch(e){setBackupStatus('❌ '+e.message);render()}}
function persist(){if(!editor)return;localStorage.setItem(KEY,JSON.stringify(people));render();if(ref)ref.set({people:clean(people)}).catch(e=>setBackupStatus('❌ پاشەکەوت نەکرا: '+e.message))}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const shown=people.filter(p=>p.name.toLocaleLowerCase().includes(q));$('total').textContent=fmt(people.reduce((s,p)=>s+Number(p.amount||0),0));$('count').textContent=fmt(shown.length)+' کەس';$('list').innerHTML='';if(!shown.length){$('list').innerHTML='<div class="empty">'+(people.length?'هیچ ناوێک نەدۆزرایەوە':'هێشتا هیچ قەرزێک تۆمار نەکراوە')+'</div>';return}shown.forEach(p=>{const el=document.createElement('div');el.className='person';const info=document.createElement('div');const nm=document.createElement('button');nm.className='name-toggle person-name';nm.type='button';nm.textContent=p.name+'  ▾';const detail=document.createElement('div');detail.className='debt-details hidden';nm.setAttribute('aria-expanded','false');nm.onclick=()=>{const opening=detail.classList.contains('hidden');detail.classList.toggle('hidden');nm.setAttribute('aria-expanded',String(opening));nm.textContent=p.name+(opening?'  ▴':'  ▾')};const am=document.createElement('div');am.className='amount';am.textContent=fmt(p.amount)+' دینار';const dt=document.createElement('div');dt.className='datetime';dt.textContent='بەروار و کات: '+formatDateTime(p.createdAt);info.append(nm,am,dt);const debts=(Array.isArray(p.debts)?p.debts:[]);debts.forEach((d,index)=>{const line=document.createElement('div');line.className='debt-line';line.style.flexWrap='wrap';const when=document.createElement('span');when.textContent='قەرزی '+(index+1)+' · '+formatDateTime(d.createdAt);const val=document.createElement('strong');val.textContent=fmt(d.amount)+' دینار';const tools=document.createElement('span');tools.style.display='flex';tools.style.gap='6px';const editDebt=document.createElement('button');editDebt.className='secondary';editDebt.textContent='دەستکاری';editDebt.style.padding='6px 9px';editDebt.style.fontSize='11px';editDebt.onclick=()=>editDebtEntry(p.id,d.id);const deleteDebt=document.createElement('button');deleteDebt.className='danger';deleteDebt.textContent='سڕینەوە';deleteDebt.style.padding='6px 9px';deleteDebt.style.fontSize='11px';deleteDebt.onclick=()=>deleteDebtEntry(p.id,d.id);tools.append(editDebt,deleteDebt);line.append(when,val,tools);detail.append(line)});if(debts.length){const hint=document.createElement('div');hint.className='detail-hint';hint.textContent='کۆی قەرزەکان: '+fmt(p.amount)+' دینار';detail.append(hint)}info.append(detail);const acts=document.createElement('div');acts.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='دەستکاری';edit.textContent='دەستکاری ناو';edit.onclick=()=>renamePerson(p.id);const del=document.createElement('button');del.className='danger';del.textContent='سڕینەوە';del.onclick=()=>{if(confirm('دڵنیایت لە سڕینەوەی ئەم تۆمارە؟')){people=people.filter(x=>x.id!==p.id);if(editing===p.id)resetForm();persist()}};acts.append(edit,del);el.append(info,acts);$('list').append(el)})}
function recomputePerson(p){p.amount=(p.debts||[]).reduce((sum,d)=>sum+Number(d.amount||0),0)}
function editDebtEntry(personId,debtId){const p=people.find(x=>x.id===personId);if(!p)return;const d=(p.debts||[]).find(x=>x.id===debtId);if(!d)return;const amountText=prompt('بڕی نوێی ئەم قەرزە بە دینار بنووسە:',String(d.amount));if(amountText===null)return;const amount=Number(amountText.trim());if(!Number.isFinite(amount)||amount<0){alert('تکایە بڕێکی دروست بنووسە.');return}d.amount=amount;const dateText=prompt('بەروار و کات (بە شێوەی ISO)؛ بەتاڵ بهێڵە بۆ پاراستنی کاتی ئێستا:',d.createdAt||'');if(dateText!==null&&dateText.trim()){const parsed=new Date(dateText.trim());if(!Number.isNaN(parsed.getTime()))d.createdAt=parsed.toISOString()}recomputePerson(p);persist()}
function deleteDebtEntry(personId,debtId){const p=people.find(x=>x.id===personId);if(!p)return;if(!confirm('دڵنیایت لە سڕینەوەی ئەم قەرزە؟'))return;p.debts=(p.debts||[]).filter(d=>d.id!==debtId);recomputePerson(p);if(!p.debts.length)people=people.filter(x=>x.id!==personId);persist()}
function renamePerson(id){const p=people.find(x=>x.id===id);if(!p)return;const value=prompt('ناوی نوێی کەس بنووسە:',p.name);if(value===null)return;const name=value.trim();if(!name){alert('ناو نابێت بەتاڵ بێت.');return}const duplicate=people.find(x=>x.id!==id&&normalizeName(x.name)===normalizeName(name));if(duplicate){if(!confirm('ئەم ناوە پێشتر هەیە. دەتەوێت قەرزەکان لەگەڵ ئەو کەسە یەک بخرێنەوە؟'))return;duplicate.debts=[...(duplicate.debts||[]),...(p.debts||[])];recomputePerson(duplicate);people=people.filter(x=>x.id!==id)}else p.name=name;persist()}
function resetForm(){editing=null;$('debtForm').reset();$('formTitle').textContent='＋ زیادکردنی کەسێکی نوێ';$('saveBtn').textContent='زیادکردن';$('cancelBtn').classList.add('hidden')}
function startEdit(id){const p=people.find(x=>x.id===id);if(!p)return;editing=id;$('personName').value=p.name;$('personAmount').value=p.amount;$('formTitle').textContent='دەستکاریکردنی تۆمار';$('saveBtn').textContent='پاشەکەوتکردنی گۆڕانکاری';$('cancelBtn').classList.remove('hidden');$('personName').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('debtForm').addEventListener('submit',e=>{e.preventDefault();const name=$('personName').value.trim();const amount=Number($('personAmount').value);if(!name||!Number.isFinite(amount)||amount<0)return;if(editing!==null){const p=people.find(x=>x.id===editing);if(p){p.name=name;const current=Number(p.amount||0);const delta=amount-current;if(delta!==0){p.debts=p.debts||[];p.debts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:delta,createdAt:new Date().toISOString()})}p.amount=amount}}else{const existing=people.find(x=>normalizeName(x.name)===normalizeName(name));const now=new Date().toISOString();if(existing){existing.debts=existing.debts||[{id:Date.now().toString(36),amount:Number(existing.amount||0),createdAt:existing.createdAt||now}];existing.debts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount,createdAt:now});existing.amount=existing.debts.reduce((sum,d)=>sum+Number(d.amount||0),0)}else people.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,amount,debts:[{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount,createdAt:now}],createdAt:now})}resetForm();persist()});$('cancelBtn').onclick=resetForm;$('search').addEventListener('input',render);initialize();
</script></body></html>
