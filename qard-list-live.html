.wrap{width:min(100%,760px);margin:auto;position:relative;z-index:1}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:5px 2px 24px;animation:rise .65s both}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#a855f7,#5b21b6);box-shadow:0 8px 30px #8b35ed55,inset 0 1px #ffffff55}.eyebrow{color:#c4a5fd;font-size:11px;font-weight:850;letter-spacing:.7px}.head h1{font-size:clamp(23px,5vw,30px);font-weight:900;margin:4px 0 0;letter-spacing:-.5px}.pill{border:1px solid #a78bfa44;background:#8b5cf622;border-radius:99px;padding:9px 13px;color:#d8c6ff;font-size:11px;font-weight:800;white-space:nowrap}
.summary{position:relative;overflow:hidden;border:1px solid #b98aff44;border-radius:28px;padding:24px;margin-bottom:17px;background:linear-gradient(115deg,#17142b 0%,#17172f 55%,#102a31 130%);box-shadow:0 20px 55px #0008,inset 0 1px #ffffff12;animation:rise .7s .06s both}.summary:before,.summary:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.summary:before{width:250px;height:250px;right:-80px;top:-145px;background:#9333ea33;filter:blur(10px)}.summary:after{width:180px;height:180px;left:-100px;bottom:-120px;background:#14b8a633;filter:blur(20px)}.summary-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.summary small{color:#b9b4d0;font-size:12px;font-weight:750}.live{display:inline-flex;align-items:center;gap:7px;color:#a3ffbd;font-size:10px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}.total{position:relative;z-index:1;font-size:clamp(38px,9vw,52px);font-weight:950;letter-spacing:-1.5px;margin:12px 0 1px;background:linear-gradient(90deg,#d8b4fe,#a3ff6f 80%);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}.unit{font-size:12px;color:#a9a6c2}.summary-bottom{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin-top:17px;color:#c8c1dc;font-size:11px}.trend{background:#163c35;color:#9dffbd;border:1px solid #38d99a33;padding:5px 9px;border-radius:99px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px;animation:rise .7s .12s both}.stat{padding:14px 13px;border-radius:19px;background:linear-gradient(145deg,#171a30,#101322);border:1px solid var(--line);box-shadow:0 10px 25px #0003}.stat-icon{font-size:19px;margin-bottom:8px}.stat-label{font-size:10px;color:#aaa8c4}.stat-value{font-size:22px;font-weight:900;margin-top:3px}.stat:nth-child(1) .stat-icon{color:#c084fc}.stat:nth-child(2) .stat-icon{color:#fbbf24}.stat:nth-child(3) .stat-icon{color:#5eead4}
.panel{background:linear-gradient(145deg,rgba(24,27,49,.96),rgba(15,18,33,.97));border:1px solid var(--line);border-radius:24px;padding:19px;margin-bottom:16px;box-shadow:0 16px 42px #0004,inset 0 1px #ffffff08;animation:rise .7s .18s both}.panel h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;margin:0 0 17px}.panel h2 .h-icon{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#9333ea25;color:#d8b4fe;font-size:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:11px;color:#aaa8c4;margin:0 2px 7px;font-weight:750}input{width:100%;min-width:0;background:#090d1c;border:1px solid #343550;border-radius:14px;color:#fff;padding:15px 14px;font:inherit;font-size:14px;outline:none;transition:.25s}input::placeholder{color:#73758f}input:focus{border-color:#b16aff;background:#0d1022;box-shadow:0 0 0 4px #9333ea22,0 0 22px #9333ea18}
button{font:inherit;border:0;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #c084fc;outline-offset:3px}.primary{width:100%;margin-top:14px;color:white;background:linear-gradient(105deg,#7c3aed,#a855f7 55%,#14b8a6);box-shadow:0 9px 26px #8b35ed44;padding:15px;font-size:15px}.primary:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 12px 32px #8b35ed66}.secondary{background:#302044;color:#e9d5ff;border:1px solid #a855f744}.secondary:hover{background:#42275e}.danger{background:#3a1c2b;color:#ff9eb2;border:1px solid #ff6b8833;padding:9px 11px}.actions{display:flex;gap:7px;align-items:center}.actions button{font-size:10px;padding:9px 10px;white-space:nowrap}
.tools{display:flex;gap:10px;align-items:center;margin:0 0 13px}.tools input{flex:1}.count{font-size:10px;color:#d8c6ff;white-space:nowrap;background:#302044;border:1px solid #a855f733;padding:9px 11px;border-radius:11px;font-weight:800}.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 13px;margin:10px 0;background:linear-gradient(110deg,#171a2d,#101424);border:1px solid #ffffff12;border-right:3px solid #a855f7;border-radius:19px;transition:.25s;animation:cardIn .42s both}.person:nth-child(3n+2){border-right-color:#38bdf8}.person:nth-child(3n){border-right-color:#34d399}.person:hover{transform:translateY(-3px);border-color:#a855f755;box-shadow:0 12px 30px #0005}.person>div:first-child{min-width:0;flex:1;display:flex;align-items:center;gap:11px}.avatar{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#7135a8,#321e55);border:1px solid #c084fc55;color:#f3e8ff;font-weight:900;font-size:17px;box-shadow:inset 0 1px #ffffff25}.person:nth-child(3n+2) .avatar{background:linear-gradient(145deg,#155e75,#172b4c);border-color:#38bdf855}.person:nth-child(3n) .avatar{background:linear-gradient(145deg,#16604f,#173b38);border-color:#34d39955}.person-main{display:block!important;min-width:0}.person-name{font-weight:850;overflow-wrap:anywhere}.name-toggle{background:transparent;color:#f7f5ff;padding:0;text-align:right;font-weight:850;border-radius:0;font-size:14px}.name-toggle:hover{color:#d8b4fe}.debt-details{margin-top:10px;padding:11px 13px;background:#090d1c;border:1px solid var(--line);border-radius:13px}.debt-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff12;font-size:10px;color:#aaa8c4}.debt-line:last-child{border-bottom:0}.debt-line strong{color:var(--mint);white-space:nowrap;font-size:12px}.detail-hint{font-size:10px;color:#9296b3;margin-top:8px}.amount{font-weight:950;color:var(--mint);margin-top:5px;font-size:15px}.datetime{font-size:9px;color:#8588a4;margin-top:5px;line-height:1.7}.empty{text-align:center;color:#9296b3;padding:30px 10px;font-size:13px}.empty-icon{font-size:35px;color:#b78aff;margin-bottom:8px}.empty p{font-size:11px}.foot{font-size:10px;color:#777b99;text-align:center;line-height:1.9;margin:20px 8px}.hidden{display:none!important}#authBtn{width:100%;margin-top:9px;max-width:280px}.viewonly #formPanel,.viewonly .actions,.viewonly .debt-line>span:last-child{display:none!important}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{0%,100%{box-shadow:0 0 0 #a855f700}50%{box-shadow:0 0 26px #a855f733}}
@media(max-width:520px){body{padding:18px 11px 105px}.head{margin-bottom:17px}.head h1{font-size:23px}.pill{font-size:9px;padding:8px 10px}.summary{padding:20px;border-radius:23px}.panel{padding:16px;border-radius:20px}.fields{grid-template-columns:1fr;gap:11px}.person{align-items:center;padding:13px 10px}.actions{flex-shrink:0;flex-direction:column}.actions button{width:100%;min-width:76px}.total{font-size:38px}.debt-line{align-items:flex-start;flex-wrap:wrap}.stats{gap:7px}.stat{padding:12px 9px}.stat-value{font-size:19px}.stat-label{font-size:9px}.avatar{width:39px;height:39px;flex-basis:39px}.datetime{font-size:8px}}

<section class="panel" id="formPanel"><h2 id="formTitle"><span class="h-icon">＋</span> زیادکردنی کەسێکی نوێ</h2><form id="debtForm"><div class="fields"><div><label for="personName">ناوی کەس</label><input id="personName" maxlength="80" placeholder="ناوی کەس بنووسە" required></div><div><label for="personAmount">بڕی قەرز · دینار</label><input id="personAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="250000" required></div></div><button class="primary" id="saveBtn" type="submit">＋　زیادکردنی تۆمار</button><button class="secondary hidden" id="cancelBtn" type="button" style="width:100%;margin-top:8px">هەڵوەشاندنەوەی دەستکاری</button></form></section>
<section class="panel" id="peoplePanel"><h2><span class="h-icon">▤</span> تۆمارەکان</h2><div class="tools"><input id="search" placeholder="⌕  گەڕان بەدوای ناو..." aria-label="گەڕان"><span class="count" id="count">0 کەس</span></div><div id="list"></div></section>
<p class="foot"><span id="backupStatus">...</span><br>پاراستنی داتا و هاوکاتکردنی ڕاستەوخۆ<br><button id="authBtn" class="secondary" type="button"></button></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== ڕێکخستن: ئەم دوو بەشە بگۆڕە ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyAz9TPABXysR1ZdbG9ncc4DxjtBnQ3gbRQ",authDomain:"qard-list.firebaseapp.com",projectId:"qard-list",storageBucket:"qard-list.firebasestorage.app",messagingSenderId:"77850940561",appId:"1:77850940561:web:0e797156bdc16bf3a91b30"};
/* ====================================== */
const KEY='qard-list-v1', DB_NAME='qard-list-backup-v1', STORE='snapshots';let people=[];let editing=null;let db=null;
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-US').format(n);
function normalizeName(value){return String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function ensureDebtEntries(person){if(Array.isArray(person.debts)&&person.debts.length){person.debts=person.debts.map(d=>({id:d.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:Number(d.amount||0),createdAt:d.createdAt||person.createdAt||new Date().toISOString()}));person.amount=person.debts.reduce((sum,d)=>sum+d.amount,0)}else{person.debts=[{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:Number(person.amount||0),createdAt:person.createdAt||new Date().toISOString()}];person.amount=person.debts[0].amount}return person}
function mergeDuplicatePeople(items){const merged=[];const byName=new Map();for(const raw of items){const person=ensureDebtEntries({...raw});const key=normalizeName(person.name);if(!key)continue;const existing=byName.get(key);if(existing){existing.debts.push(...person.debts);existing.amount=existing.debts.reduce((sum,d)=>sum+d.amount,0);const dates=[existing.createdAt,person.createdAt].filter(Boolean).sort();if(dates.length)existing.createdAt=dates[0]}else{byName.set(key,person);merged.push(person)}}return merged}
function formatDateTime(value){if(!value)return 'کاتی تۆمارکردن بەردەست نییە';const d=new Date(value);if(Number.isNaN(d.getTime()))return 'کاتی تۆمارکردن بەردەست نییە';return new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)}
function openBackupDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB not supported'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function backupNow(){if(!db)return Promise.reject(new Error('Backup database unavailable'));return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({people,updatedAt:new Date().toISOString()},'latest');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function readBackup(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('latest');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
function setBackupStatus(message){$('backupStatus').textContent=message}
function loadLocal(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(parsed)?parsed:[]}catch{return []}}
let ref=null,unsub=null,editor=false;
const EDITOR_UID='IJBG9n9C5qaLzqocTG1mqPmbsS52';
const isEditor=()=>editor;
function applyMode(){document.body.classList.toggle('viewonly',!editor);$('authBtn').textContent=editor?'🔓 دەرچوون لە دەستکاریکردن':'🔒 چوونە ناو دەستکاریکردن'}
$('authBtn').onclick=async()=>{if(!window.firebase)return;if(editor){await firebase.auth().signOut();return}
const em=prompt('ئیمەیڵ:',localStorage.getItem('qard-email')||'');if(!em)return;const pw=prompt('وشەی نهێنی:');if(pw===null)return;
try{await firebase.auth().signInWithEmailAndPassword(em.trim(),pw);localStorage.setItem('qard-email',em.trim())}catch(e){alert('نەتوانرا بچیتە ژوورەوە: '+e.message)}};
const clean=o=>JSON.parse(JSON.stringify(o));
function listen(){if(unsub)return;ref=firebase.firestore().collection('debts').doc('main');
unsub=ref.onSnapshot(s=>{const v=s.exists?s.data().people:null;people=mergeDuplicatePeople(Array.isArray(v)?v:[]);if(people.length)localStorage.setItem(KEY,JSON.stringify(people));setBackupStatus('🟢 Live — پەیوەستە');render()},
e=>{setBackupStatus('❌ پەیوەندی سەرنەکەوت: '+e.message);people=mergeDuplicatePeople(loadLocal());render()})}
function initialize(){applyMode();
if(!window.firebase||FIREBASE_CONFIG.apiKey.startsWith('YOUR')){people=mergeDuplicatePeople(loadLocal());setBackupStatus('⚠️ Firebase ڕێک نەخراوە');render();return}
try{firebase.initializeApp(FIREBASE_CONFIG);
firebase.auth().onAuthStateChanged(u=>{
if(!u){editor=false;applyMode();firebase.auth().signInAnonymously().catch(e=>setBackupStatus('❌ '+e.message));return}
editor=(u.uid===EDITOR_UID);applyMode();listen();
if(editor)setTimeout(()=>{if(editor&&!people.length){const old=loadLocal();if(old.length&&confirm('داتای کۆنی ئەم ئامێرە دۆزرایەوە ('+old.length+' کەس). بنێردرێت بۆ Firebase؟')){people=mergeDuplicatePeople(old);persist()}}},1500)})}
catch(e){setBackupStatus('❌ '+e.message);render()}}
function persist(){if(!editor)return;localStorage.setItem(KEY,JSON.stringify(people));render();if(ref)ref.set({people:clean(people)}).catch(e=>setBackupStatus('❌ پاشەکەوت نەکرا: '+e.message))}
function render(){
const q=$('search').value.trim().toLocaleLowerCase();
const shown=people.filter(p=>p.name.toLocaleLowerCase().includes(q));
const total=people.reduce((s,p)=>s+Number(p.amount||0),0);
$('total').textContent=fmt(total);
$('count').textContent=fmt(shown.length)+' کەس';
$('peopleCount').textContent=fmt(people.length);
$('debtorsCount').textContent=fmt(people.filter(p=>Number(p.amount||0)>0).length);
$('entriesCount').textContent=fmt(people.reduce((s,p)=>s+(p.debts||[]).length,0));
$('list').innerHTML='';
if(!shown.length){$('list').innerHTML='<div class="empty"><div class="empty-icon">⌕</div><strong>'+(people.length?'هیچ ناوێک نەدۆزرایەوە':'هێشتا هیچ قەرزێک تۆمار نەکراوە')+'</strong><p>بە گەڕانێکی تر هەوڵ بدەرەوە</p></div>';return}
shown.forEach(p=>{const el=document.createElement('div');el.className='person';const info=document.createElement('div');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(p.name||'?').trim().charAt(0).toUpperCase();
const main=document.createElement('div');main.className='person-main';
const nm=document.createElement('button');nm.className='name-toggle person-name';nm.type='button';nm.textContent=p.name+'  ▾';const detail=document.createElement('div');detail.className='debt-details hidden';nm.setAttribute('aria-expanded','false');nm.onclick=()=>{const opening=detail.classList.contains('hidden');detail.classList.toggle('hidden');nm.setAttribute('aria-expanded',String(opening));nm.textContent=p.name+(opening?'  ▴':'  ▾')};const am=document.createElement('div');am.className='amount';am.textContent=fmt(p.amount)+' دینار';const dt=document.createElement('div');dt.className='datetime';dt.textContent='بەروار و کات: '+formatDateTime(p.createdAt);main.append(nm,am,dt);info.append(avatar,main);const debts=(Array.isArray(p.debts)?p.debts:[]);debts.forEach((d,index)=>{const line=document.createElement('div');line.className='debt-line';line.style.flexWrap='wrap';const when=document.createElement('span');when.textContent='قەرزی '+(index+1)+' · '+formatDateTime(d.createdAt);const val=document.createElement('strong');val.textContent=fmt(d.amount)+' دینار';const tools=document.createElement('span');tools.style.display='flex';tools.style.gap='6px';const editDebt=document.createElement('button');editDebt.className='secondary';editDebt.textContent='دەستکاری';editDebt.style.padding='6px 9px';editDebt.style.fontSize='11px';editDebt.onclick=()=>editDebtEntry(p.id,d.id);const deleteDebt=document.createElement('button');deleteDebt.className='danger';deleteDebt.textContent='سڕینەوە';deleteDebt.style.padding='6px 9px';deleteDebt.style.fontSize='11px';deleteDebt.onclick=()=>deleteDebtEntry(p.id,d.id);tools.append(editDebt,deleteDebt);line.append(when,val,tools);detail.append(line)});if(debts.length){const hint=document.createElement('div');hint.className='detail-hint';hint.textContent='کۆی قەرزەکان: '+fmt(p.amount)+' دینار';detail.append(hint)}info.append(detail);const acts=document.createElement('div');acts.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='دەستکاری';edit.textContent='✎ دەستکاری ناو';edit.onclick=()=>renamePerson(p.id);const del=document.createElement('button');del.className='danger';del.textContent='سڕینەوە';del.onclick=()=>{if(confirm('دڵنیایت لە سڕینەوەی ئەم تۆمارە؟')){people=people.filter(x=>x.id!==p.id);if(editing===p.id)resetForm();persist()}};acts.append(edit,del);el.append(info,acts);$('list').append(el)})}
function recomputePerson(p){p.amount=(p.debts||[]).reduce((sum,d)=>sum+Number(d.amount||0),0)}
function editDebtEntry(personId,debtId){const p=people.find(x=>x.id===personId);if(!p)return;const d=(p.debts||[]).find(x=>x.id===debtId);if(!d)return;const amountText=prompt('بڕی نوێی ئەم قەرزە بە دینار بنووسە:',String(d.amount));if(amountText===null)return;const amount=Number(amountText.trim());if(!Number.isFinite(amount)||amount<0){alert('تکایە بڕێکی دروست بنووسە.');return}d.amount=amount;const dateText=prompt('بەروار و کات (بە شێوەی ISO)؛ بەتاڵ بهێڵە بۆ پاراستنی کاتی ئێستا:',d.createdAt||'');if(dateText!==null&&dateText.trim()){const parsed=new Date(dateText.trim());if(!Number.isNaN(parsed.getTime()))d.createdAt=parsed.toISOString()}recomputePerson(p);persist()}
function deleteDebtEntry(personId,debtId){const p=people.find(x=>x.id===personId);if(!p)return;if(!confirm('دڵنیایت لە سڕینەوەی ئەم قەرزە؟'))return;p.debts=(p.debts||[]).filter(d=>d.id!==debtId);recomputePerson(p);if(!p.debts.length)people=people.filter(x=>x.id!==personId);persist()}
function renamePerson(id){const p=people.find(x=>x.id===id);if(!p)return;const value=prompt('ناوی نوێی کەس بنووسە:',p.name);if(value===null)return;const name=value.trim();if(!name){alert('ناو نابێت بەتاڵ بێت.');return}const duplicate=people.find(x=>x.id!==id&&normalizeName(x.name)===normalizeName(name));if(duplicate){if(!confirm('ئەم ناوە پێشتر هەیە. دەتەوێت قەرزەکان لەگەڵ ئەو کەسە یەک بخرێنەوە؟'))return;duplicate.debts=[...(duplicate.debts||[]),...(p.debts||[])];recomputePerson(duplicate);people=people.filter(x=>x.id!==id)}else p.name=name;persist()}
function resetForm(){editing=null;$('debtForm').reset();$('formTitle').textContent='＋ زیادکردنی کەسێکی نوێ';$('saveBtn').textContent='زیادکردن';$('cancelBtn').classList.add('hidden')}
function startEdit(id){const p=people.find(x=>x.id===id);if(!p)return;editing=id;$('personName').value=p.name;$('personAmount').value=p.amount;$('formTitle').textContent='دەستکاریکردنی تۆمار';$('saveBtn').textContent='پاشەکەوتکردنی گۆڕانکاری';$('cancelBtn').classList.remove('hidden');$('personName').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('debtForm').addEventListener('submit',e=>{e.preventDefault();const name=$('personName').value.trim();const amount=Number($('personAmount').value);if(!name||!Number.isFinite(amount)||amount<0)return;if(editing!==null){const p=people.find(x=>x.id===editing);if(p){p.name=name;const current=Number(p.amount||0);const delta=amount-current;if(delta!==0){p.debts=p.debts||[];p.debts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:delta,createdAt:new Date().toISOString()})}p.amount=amount}}else{const existing=people.find(x=>normalizeName(x.name)===normalizeName(name));const now=new Date().toISOString();if(existing){existing.debts=existing.debts||[{id:Date.now().toString(36),amount:Number(existing.amount||0),createdAt:existing.createdAt||now}];existing.debts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount,createdAt:now});existing.amount=existing.debts.reduce((sum,d)=>sum+Number(d.amount||0),0)}else people.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,amount,debts:[{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount,createdAt:now}],createdAt:now})}resetForm();persist()});$('cancelBtn').onclick=resetForm;$('search').addEventListener('input',render);initialize();
</script>
</body></html>
